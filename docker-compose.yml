services:
  metashelf:
    image: ghcr.io/syfq91/metashelf:latest
    container_name: metashelf
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      METASHELF_CONFIG_DIR: /config
      METASHELF_MEDIA_ROOTS: /media/movies,/media/tv,/media/music,/media/ebooks,/media/comics
      METASHELF_BASE_URL: ""
      METASHELF_LOG_LEVEL: INFO
      METASHELF_TMDB_API_KEY: ""
    volumes:
      - ./config:/config
      - ./media/movies:/media/movies
      - ./media/tv:/media/tv
      - ./media/music:/media/music
      - ./media/ebooks:/media/ebooks
      - ./media/comics:/media/comics
    # Note: For production TLS, place behind Caddy or Traefik and set METASHELF_BASE_URL if needed.
