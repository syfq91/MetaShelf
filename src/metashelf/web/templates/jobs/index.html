{% extends "base.html" %}
{% block title %}Jobs — MetaShelf{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold">Background Jobs</h1>
    <button type="button" class="btn btn-ghost btn-sm"
            hx-get="{{ base_url }}/jobs/table"
            hx-target="#jobs-table-container"
            hx-swap="innerHTML">
      Refresh
    </button>
  </div>

  <div id="jobs-table-container"
       hx-get="{{ base_url }}/jobs/table"
       hx-trigger="jobs-updated from:body"
       hx-swap="innerHTML">
    {% include "jobs/_table.html" %}
  </div>
</div>

<script>
  (function() {
    const src = new EventSource("{{ base_url }}/jobs/stream");
    src.addEventListener("jobs", function() {
      document.body.dispatchEvent(new CustomEvent("jobs-updated"));
    });
  })();
</script>
{% endblock %}
