<div class="p-4 space-y-4">
  {% if toast %}
  <div class="alert alert-info text-sm py-2">{{ toast }}</div>
  {% endif %}

  <div class="flex items-start gap-4">
    <div class="w-24 h-36 bg-base-200 rounded-box overflow-hidden border border-base-300 flex items-center justify-center flex-shrink-0">
      {% if 'cover' in art_map %}
      <img src="{{ base_url }}/comics/{{ item.id }}/artwork/cover" alt="Cover" class="w-full h-full object-cover" />
      {% else %}
      <span class="text-xs opacity-40">No Cover</span>
      {% endif %}
    </div>
    <div class="flex-1 space-y-2">
      <div class="flex items-center gap-2">
        <h2 class="text-xl font-bold">{{ meta.series }} #{{ meta.number }} — {{ meta.title }}</h2>
        <span class="badge badge-sm">{{ item.state }}</span>
      </div>
      <p class="text-xs font-mono opacity-60">{{ item.rel_path }}</p>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline btn-xs"
                hx-get="{{ base_url }}/comics/{{ item.id }}/scrape"
                hx-target="#modal-container"
                hx-swap="innerHTML">Search Google Books</button>
        <button type="button" class="btn btn-success btn-xs"
                hx-post="{{ base_url }}/comics/{{ item.id }}/save"
                hx-target="#comic-detail-pane"
                hx-swap="innerHTML">Save ComicInfo XML</button>
      </div>
    </div>
  </div>

  <form hx-post="{{ base_url }}/comics/{{ item.id }}/edit"
        hx-target="#comic-detail-pane"
        hx-swap="innerHTML"
        class="space-y-3">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Series</span></label>
        <input type="text" name="series" value="{{ meta.series }}" class="input input-bordered input-sm" />
      </div>
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Title</span></label>
        <input type="text" name="title" value="{{ meta.title }}" class="input input-bordered input-sm" />
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-xs">Number</span></label>
          <input type="text" name="number" value="{{ meta.number }}" class="input input-bordered input-sm" />
        </div>
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-xs">Volume</span></label>
          <input type="text" name="volume" value="{{ meta.volume or '' }}" class="input input-bordered input-sm" />
        </div>
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-xs">Year</span></label>
          <input type="text" name="year" value="{{ meta.year or '' }}" class="input input-bordered input-sm" />
        </div>
      </div>
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Publisher</span></label>
        <input type="text" name="publisher" value="{{ meta.publisher }}" class="input input-bordered input-sm" />
      </div>
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Writers (comma-separated)</span></label>
        <input type="text" name="writers" value="{{ meta.writers | join(', ') }}" class="input input-bordered input-sm" />
      </div>
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Artists (comma-separated)</span></label>
        <input type="text" name="artists" value="{{ meta.artists | join(', ') }}" class="input input-bordered input-sm" />
      </div>
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Summary</span></label>
      <textarea name="summary" rows="4" class="textarea textarea-bordered textarea-sm">{{ meta.summary }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Apply Edits</button>
  </form>
</div>
