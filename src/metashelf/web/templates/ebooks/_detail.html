<div class="p-4 space-y-4">
  {% if toast %}
  <div class="alert alert-info text-sm py-2">{{ toast }}</div>
  {% endif %}

  <div class="flex items-start gap-4">
    <div class="w-24 h-36 bg-base-200 rounded-box overflow-hidden border border-base-300 flex items-center justify-center flex-shrink-0">
      {% if 'cover' in art_map %}
      <img src="{{ base_url }}/ebooks/{{ item.id }}/artwork/cover" alt="Cover" class="w-full h-full object-cover" />
      {% else %}
      <span class="text-xs opacity-40">No Cover</span>
      {% endif %}
    </div>
    <div class="flex-1 space-y-2">
      <div class="flex items-center gap-2">
        <h2 class="text-xl font-bold">{{ meta.title }}</h2>
        <span class="badge badge-sm">{{ item.state }}</span>
      </div>
      <p class="text-xs font-mono opacity-60">{{ item.rel_path }}</p>
      <button type="button" class="btn btn-success btn-xs"
              hx-post="{{ base_url }}/ebooks/{{ item.id }}/save"
              hx-target="#ebook-detail-pane"
              hx-swap="innerHTML">Save .opf</button>
    </div>
  </div>

  <form hx-post="{{ base_url }}/ebooks/{{ item.id }}/edit"
        hx-target="#ebook-detail-pane"
        hx-swap="innerHTML"
        class="space-y-3">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Title</span></label>
        <input type="text" name="title" value="{{ meta.title }}" class="input input-bordered input-sm" />
      </div>
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Authors (comma-separated)</span></label>
        <input type="text" name="authors" value="{{ meta.authors | join(', ') }}" class="input input-bordered input-sm" />
      </div>
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Series</span></label>
        <input type="text" name="series" value="{{ meta.series }}" class="input input-bordered input-sm" />
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-xs">Series Index</span></label>
          <input type="text" name="series_index" value="{{ meta.series_index }}" class="input input-bordered input-sm" />
        </div>
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-xs">ISBN</span></label>
          <input type="text" name="isbn" value="{{ meta.isbn }}" class="input input-bordered input-sm" />
        </div>
      </div>
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Publisher</span></label>
        <input type="text" name="publisher" value="{{ meta.publisher }}" class="input input-bordered input-sm" />
      </div>
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Published Date</span></label>
        <input type="text" name="published_date" value="{{ meta.published_date }}" class="input input-bordered input-sm" />
      </div>
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Subjects / Tags (comma-separated)</span></label>
      <input type="text" name="subjects" value="{{ meta.subjects | join(', ') }}" class="input input-bordered input-sm" />
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Description</span></label>
      <textarea name="description" rows="4" class="textarea textarea-bordered textarea-sm">{{ meta.description }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Apply Edits</button>
  </form>
</div>
