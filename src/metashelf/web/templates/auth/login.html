{% extends "base.html" %}
{% block title %}Login — MetaShelf{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12 card bg-base-100 shadow-md border border-base-300">
  <div class="card-body">
    <h1 class="card-title text-xl">Sign In</h1>
    {% if error %}
    <div class="alert alert-error text-sm py-2">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ base_url }}/auth/login" class="space-y-3 mt-2">
      <div class="form-control">
        <label class="label" for="password"><span class="label-text">Password</span></label>
        <input id="password" name="password" type="password" required autofocus
               class="input input-bordered input-sm w-full" />
      </div>
      <button type="submit" class="btn btn-primary btn-sm w-full">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
