<form hx-post="{{ base_url }}/movies/{{ item.id }}/edit"
      hx-target="#movie-detail-pane"
      hx-swap="innerHTML"
      class="space-y-3">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="flex flex-col gap-1">
      <label class="text-xs opacity-70">Title</label>
      <input type="text" name="title" value="{{ meta.title }}" class="input input-bordered input-sm w-full" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs opacity-70">Original Title</label>
      <input type="text" name="original_title" value="{{ meta.original_title }}" class="input input-bordered input-sm w-full" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs opacity-70">Sort Title</label>
      <input type="text" name="sort_title" value="{{ meta.sort_title }}" class="input input-bordered input-sm w-full" />
    </div>
    <div class="grid grid-cols-3 gap-2">
      <div class="flex flex-col gap-1">
        <label class="text-xs opacity-70">Year</label>
        <input type="text" name="year" value="{{ meta.year or '' }}" class="input input-bordered input-sm w-full" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs opacity-70">Runtime (min)</label>
        <input type="text" name="runtime" value="{{ meta.runtime or '' }}" class="input input-bordered input-sm w-full" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs opacity-70">MPAA</label>
        <input type="text" name="mpaa" value="{{ meta.mpaa }}" class="input input-bordered input-sm w-full" />
      </div>
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs opacity-70">Premiered (YYYY-MM-DD)</label>
      <input type="text" name="premiered" value="{{ meta.premiered }}" class="input input-bordered input-sm w-full" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs opacity-70">Tagline</label>
      <input type="text" name="tagline" value="{{ meta.tagline }}" class="input input-bordered input-sm w-full" />
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-xs opacity-70">Plot</label>
    <textarea name="plot" rows="4" class="textarea textarea-bordered textarea-sm w-full">{{ meta.plot }}</textarea>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="flex flex-col gap-1">
      <label class="text-xs opacity-70">Genres (comma-separated)</label>
      <input type="text" name="genres" value="{{ meta.genres | join(', ') }}" class="input input-bordered input-sm w-full" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs opacity-70">Directors (comma-separated)</label>
      <input type="text" name="directors" value="{{ meta.directors | join(', ') }}" class="input input-bordered input-sm w-full" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs opacity-70">Writers (comma-separated)</label>
      <input type="text" name="writers" value="{{ meta.writers | join(', ') }}" class="input input-bordered input-sm w-full" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs opacity-70">Studios (comma-separated)</label>
      <input type="text" name="studios" value="{{ meta.studios | join(', ') }}" class="input input-bordered input-sm w-full" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs opacity-70">Tags (comma-separated)</label>
      <input type="text" name="tags" value="{{ meta.tags | join(', ') }}" class="input input-bordered input-sm w-full" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs opacity-70">Collection / Set</label>
      <input type="text" name="collection" value="{{ meta.collection }}" class="input input-bordered input-sm w-full" />
    </div>
  </div>

  <div class="flex items-center gap-2 pt-2">
    <button type="submit" class="btn btn-primary btn-sm">Apply Edits</button>
    <span class="text-xs opacity-60">TMDB: {{ meta.tmdb_id or '—' }} | IMDb: {{ meta.imdb_id or '—' }}</span>
  </div>
</form>
