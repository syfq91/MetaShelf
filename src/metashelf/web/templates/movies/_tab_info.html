<form hx-post="{{ base_url }}/movies/{{ item.id }}/edit"
      hx-target="#movie-detail-pane"
      hx-swap="innerHTML"
      class="space-y-3">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Title</span></label>
      <input type="text" name="title" value="{{ meta.title }}" class="input input-bordered input-sm" />
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Original Title</span></label>
      <input type="text" name="original_title" value="{{ meta.original_title }}" class="input input-bordered input-sm" />
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Sort Title</span></label>
      <input type="text" name="sort_title" value="{{ meta.sort_title }}" class="input input-bordered input-sm" />
    </div>
    <div class="grid grid-cols-3 gap-2">
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Year</span></label>
        <input type="text" name="year" value="{{ meta.year or '' }}" class="input input-bordered input-sm" />
      </div>
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">Runtime (min)</span></label>
        <input type="text" name="runtime" value="{{ meta.runtime or '' }}" class="input input-bordered input-sm" />
      </div>
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs">MPAA</span></label>
        <input type="text" name="mpaa" value="{{ meta.mpaa }}" class="input input-bordered input-sm" />
      </div>
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Premiered (YYYY-MM-DD)</span></label>
      <input type="text" name="premiered" value="{{ meta.premiered }}" class="input input-bordered input-sm" />
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Tagline</span></label>
      <input type="text" name="tagline" value="{{ meta.tagline }}" class="input input-bordered input-sm" />
    </div>
  </div>

  <div class="form-control">
    <label class="label py-1"><span class="label-text text-xs">Plot</span></label>
    <textarea name="plot" rows="4" class="textarea textarea-bordered textarea-sm">{{ meta.plot }}</textarea>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Genres (comma-separated)</span></label>
      <input type="text" name="genres" value="{{ meta.genres | join(', ') }}" class="input input-bordered input-sm" />
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Directors (comma-separated)</span></label>
      <input type="text" name="directors" value="{{ meta.directors | join(', ') }}" class="input input-bordered input-sm" />
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Writers (comma-separated)</span></label>
      <input type="text" name="writers" value="{{ meta.writers | join(', ') }}" class="input input-bordered input-sm" />
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Studios (comma-separated)</span></label>
      <input type="text" name="studios" value="{{ meta.studios | join(', ') }}" class="input input-bordered input-sm" />
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Tags (comma-separated)</span></label>
      <input type="text" name="tags" value="{{ meta.tags | join(', ') }}" class="input input-bordered input-sm" />
    </div>
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-xs">Collection / Set</span></label>
      <input type="text" name="collection" value="{{ meta.collection }}" class="input input-bordered input-sm" />
    </div>
  </div>

  <div class="flex items-center gap-2 pt-2">
    <button type="submit" class="btn btn-primary btn-sm">Apply Edits</button>
    <span class="text-xs opacity-60">TMDB: {{ meta.tmdb_id or '—' }} | IMDb: {{ meta.imdb_id or '—' }}</span>
  </div>
</form>
