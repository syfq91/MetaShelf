<div class="space-y-3 text-sm">
  <div>
    <div class="text-xs font-semibold opacity-70">Media File</div>
    <div class="font-mono text-xs bg-base-200 p-2 rounded mt-1">{{ item.rel_path }}</div>
  </div>
  <div>
    <div class="text-xs font-semibold opacity-70">NFO Sidecar</div>
    <div class="font-mono text-xs bg-base-200 p-2 rounded mt-1">
      {% if nfo_exists %}{{ nfo_rel }} (present){% else %}Not written yet{% endif %}
    </div>
  </div>
  <div>
    <div class="text-xs font-semibold opacity-70">Filename Parse (guessit)</div>
    <div class="text-xs bg-base-200 p-2 rounded mt-1">
      Title: <span class="font-medium">{{ parsed.title }}</span> | Year: <span class="font-medium">{{ parsed.year or '—' }}</span>
    </div>
  </div>
</div>
